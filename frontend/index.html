<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <!-- Start the session check while the page is still parsing (speed push,
         15 Oct). AuthProvider used to send GET /auth/me only once the whole
         app bundle had downloaded and run — on a phone over 4G a second,
         serial wait before Home could even ask for its figures. This sends
         the SAME request now and parks it on window.__bbBootMe; AuthProvider
         takes it over only when it is exactly what it would have sent
         (hooks/useAuth.jsx bootProbe), else probes as before.

         Web only, Home only, cookie sessions only:
           • never in the native app shell (Capacitor) — it signs in with a
             bearer token this request does not carry;
           • only on / and /dashboard, where the answer decides what to draw;
           • on / only when the bonbox_csrf cookie says a session may exist.
             Push 9 (E) paints the logged-out landing without waiting for
             /auth/me and keeps the dictionary preload off it; a prospect's
             check is not needed for that paint, so it is not started ahead
             of it. Same cookie test as src/lib/landingBoot.js and the
             preload. A prospect gets AuthProvider's own check, as on Push 9;
           • not when an old bearer token is stored — the app sends that one.
         A plain credentialed GET with no custom header is a CORS "simple"
         request: no preflight round trip. -->
    <script>
      (function () {
        try {
          if (window.Capacitor || location.protocol === "capacitor:") return;
          var p = location.pathname.replace(/\/+$/, "") || "/";
          if (p !== "/" && p !== "/dashboard") return;
          if (p === "/" && !/(?:^|;\s*)bonbox_csrf=/.test(document.cookie)) return;
          try { if (localStorage.getItem("token")) return; } catch (e) { return; }
          var base = "%VITE_API_URL%";
          if (!base) return;
          if (base.charAt(0) === "%") {
            // No build-time API URL: the same host rule services/api.js uses.
            var h = location.hostname;
            if (h !== "bonbox.dk" && !/\.bonbox\.dk$/.test(h)) return;
            base = "https://api.bonbox.dk/api";
          }
          var url = base.replace(/\/+$/, "") + "/auth/me";
          var pr = fetch(url, { credentials: "include" }).then(function (r) {
            if (!r.ok) { var e = new Error("auth " + r.status); e.response = { status: r.status }; throw e; }
            return r.json().then(function (d) { return { data: d }; });
          });
          pr.catch(function () {});
          window.__bbBootMe = { url: url, promise: pr };
        } catch (e) {}
      })();
    </script>
    <!-- Chrome decides whether to offer/auto-apply translation from the STATIC
         shell, long before React mounts. The shell ships lang="da" because
         Denmark is the market and that is what crawlers index — but a returning
         visitor whose stored language is English then loads a page Chrome has
         already labelled Danish. With "always translate Danish" on, Chrome
         translates the ENGLISH text React renders as if it were Danish, which
         is how "Online" came out as "onion".

         So correct the attribute here, synchronously, from the same
         localStorage key the app uses — before Chrome's detector runs. React's
         effect still sets it on every later switch; this only fixes the gap
         between first paint and hydration. Wrapped in try/catch because
         private mode can throw on localStorage access, and a blank page is a
         worse outcome than a mistranslated one. -->
    <script>
      (function () {
        var l = null;
        // localStorage access alone can throw (private mode, blocked cookies).
        // Scope the catch to JUST that read — an earlier version wrapped the
        // whole block, so in private mode it bailed before the navigator
        // fallback and left the shell mislabelled, which is the exact bug this
        // guard exists to prevent.
        try { l = localStorage.getItem("lang"); } catch (e) { l = null; }
        // The browser's languages, in order (navigator.languages, then
        // navigator.language) — the list detectLanguageFromBrowser reads.
        var list = [];
        try {
          list = [].concat(navigator.languages || []).concat(navigator.language ? [navigator.language] : []);
        } catch (e) { list = []; }
        // PQ-05: Danish or Faroese ANYWHERE in that list means Danish (same
        // rule as the app and the dictionary preload; lib/shellTitles.js).
        var danish = false;
        for (var i = 0; i < list.length; i++) {
          if (/^(da|fo)(-|$)/i.test(String(list[i] || ""))) { danish = true; break; }
        }
        if (l && l !== "da" && danish) {
          // The app's one-time move: a language the browser picked under the
          // old first-entry rule becomes Danish (detectInitialLanguage). A
          // language the owner chose in the picker has no auto flag and stays.
          var auto = null;
          try { auto = localStorage.getItem("bonbox_lang_auto_picked"); } catch (e) { auto = null; }
          if (auto === "browser") l = "da";
        }
        if (!l) {
          // FIRST VISIT (or no storage): the app is about to auto-pick from
          // the browser's languages — see detectInitialLanguage. Mirror only
          // that step. The currency hint and the final "en" fallback are NOT
          // mirrored: they need app state, and guessing wrong is worse here.
          if (danish) {
            l = "da";
          } else {
            try {
              var map = { da: "da", fo: "da", en: "en", ne: "np", np: "np",
                          vi: "vi", th: "th", tr: "tr" };
              for (var j = 0; j < list.length && !l; j++) {
                var n = String(list[j] || "").toLowerCase();
                l = map[n] || map[n.split("-")[0]] || null;
              }
            } catch (e) { l = null; }
          }
        }
        // Never override the shell default with Danish-or-unknown: lang="da"
        // is already right for crawlers and the Danish market. This guard
        // exists to prevent a WRONG label, not to restate a correct one.
        if (l && l !== "da") {
          try { document.documentElement.lang = l; } catch (e) {}
        }
      })();
    </script>
    <!-- Favicon, in the order a crawler resolves it.
         /favicon.ico MUST exist as a real file: vercel.json rewrites /(.*) -> /
         for the SPA, so before this file existed a request for /favicon.ico
         returned index.html with HTTP 200 and content-type text/html. Google's
         favicon crawler probes that path by convention, so it got an
         apparently-successful response full of markup rather than a clean 404
         it could fall back from — which is why search results kept showing the
         old icon. Static files in public/ are matched before rewrites, so the
         file's existence is the fix. Raster PNGs are listed too because an
         SVG-only favicon is the least well-supported option across crawlers.
         These four links are the logo kit's snippet (docs/brand/README.md).
         The b is drawn separately for 16 and 32 px, so there is deliberately
         no SVG link: browsers that prefer an SVG would scale the 32 px
         drawing down to a soft 16 px tab icon. /favicon.svg stays in public/
         (sw.js precaches it; older pages linked it by absolute URL). -->
    <link rel="icon" href="/favicon.ico?v=3" sizes="16x16 32x32" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png?v=3" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=3" />
    <!-- 192 px for search engines: Google wants a favicon of at least 48x48 (12 Oct 2026). -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=3" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />

    <!-- NOTE: the <link rel="manifest"> is NOT shipped statically here.
         It is written by the inline script below so that on a staff-portal
         route (/s/<slug>/<token>) the browser NEVER even sees the generic
         /manifest.json (start_url "/") — on iOS the very first manifest link
         present in the initial document is what Add-to-Home binds to, and a
         JS href swap after parse is too late (see the script comment). On
         every other route the script writes the generic /manifest.json, so
         the owner app is unchanged. -->
    <script>
      // ───────────────────────────────────────────────────────────────────
      // PWA manifest selection — runs in <head> BEFORE React, before the
      // browser settles on a manifest, before any Add-to-Home read.
      //
      // THE iOS BUG THIS FIXES
      // On /s/<slug>/<token> (a staff schedule), tapping Share → Add to Home
      // Screen produced an icon that opened "/" (the generic owner app),
      // not the staff schedule. Root cause: iOS Safari Add-to-Home does NOT
      // honor a <link rel="manifest"> whose href is mutated by JavaScript
      // after the initial HTML parse. It reads the manifest reference present
      // in the *initial document*. So shipping a static generic manifest
      // (start_url "/") and "fixing" its href in JS is invisible to iOS — it
      // bookmarks the generic start_url "/". (Worse for us: iOS standalone
      // apps have storage ISOLATED from Safari, so the "/" → /s/<token>
      // localStorage fallback in PublicOrDashboard can't fire from a
      // standalone launch — localStorage is empty there.)
      //
      // THE FIX (per-platform):
      //   • iOS  → ship NO manifest at all on /s/ routes. With no manifest,
      //            iOS Add-to-Home falls back to bookmarking the CURRENT page
      //            URL (= /s/<slug>/<token>) and uses apple-touch-icon +
      //            apple-mobile-web-app-title for the icon. This is the
      //            long-stable, documented iOS behavior and makes the icon
      //            open the schedule. (StaffPortalPage further sets the
      //            apple title to the venue name; it must NOT re-add a
      //            manifest on iOS — it guards on this same flag.)
      //   • non-iOS (Android/desktop Chrome) → write the per-staff manifest
      //            as the FIRST/only manifest link so installability is
      //            evaluated against the dedicated schedule app and the
      //            install prompt arms with start_url /s/<token>.
      //   • any other route → write the generic /manifest.json (owner app
      //            install unchanged).
      //
      // We expose window.__BONBOX_IS_IOS / __BONBOX_PORTAL_TOKEN so the React
      // layer stays consistent and never re-introduces a manifest on iOS.
      // ───────────────────────────────────────────────────────────────────
      (function () {
        try {
          // iPadOS 13+ reports as "Macintosh" but is touch-capable; treat it
          // as iOS for A2HS purposes. Covers iPhone/iPad/iPod + iPad-as-Mac.
          var ua = navigator.userAgent || "";
          var isIOS =
            /iphone|ipad|ipod/i.test(ua) ||
            (navigator.maxTouchPoints > 1 && /Macintosh/i.test(ua));
          window.__BONBOX_IS_IOS = isIOS;

          var m = location.pathname.match(/^\/s\/(?:[^\/]+\/)?([^\/?#]+)/);
          var token = m && m[1] ? m[1] : null;
          window.__BONBOX_PORTAL_TOKEN = token;

          // The host stand is a door tablet, and it has exactly the same
          // Add-to-Home problem the staff portal had: the generic manifest is
          // start_url "/" + orientation portrait-primary, so an owner who
          // completed the Share-sheet ritual on /reservations/stand got an icon
          // that opened the OWNER DASHBOARD, in portrait, on a landscape
          // tablet. Nobody could test "is the web host stand good enough"
          // because an installed host stand had never actually existed.
          var isStand = /^\/reservations\/stand\/?$/.test(location.pathname);
          // R10 — a PAIRED door screen: /stand (the code page, and the start
          // page of the installed stand app) and /stand/<token> (its book).
          // These fell through to the generic manifest (start_url "/"), so
          // the home-screen icon of a paired iPad opened the owner app's
          // front door instead of tonight's book.
          var isStandDevice = /^\/stand(\/|$)/.test(location.pathname);
          window.__BONBOX_IS_STAND = isStand || isStandDevice;

          function setManifest(href) {
            var link = document.querySelector('link[rel="manifest"]');
            if (!href) {
              // No manifest wanted (iOS staff route) — make sure none exists,
              // so iOS Add-to-Home uses the current page URL.
              if (link && link.parentNode) link.parentNode.removeChild(link);
              return;
            }
            if (!link) {
              link = document.createElement("link");
              link.setAttribute("rel", "manifest");
              document.head.appendChild(link);
            }
            link.setAttribute("href", href);
          }

          if (token) {
            // The staff schedule is its own app — Vagtplan — so it wears the
            // Vagtplan icon (docs/brand: paper tile, forest b, emerald strip),
            // not the owner app's. Swapped HERE, during the parse, for the same
            // reason the manifest is chosen here: iOS Add to Home Screen takes
            // this document's apple-touch-icon, and a swap after React mounts
            // is a bet on timing. Own try: an icon must never cost the manifest.
            try {
              var icons = document.querySelectorAll('link[rel="icon"], link[rel="apple-touch-icon"]');
              for (var i = 0; i < icons.length; i++) {
                var href = icons[i].getAttribute("href") || "";
                icons[i].setAttribute("href",
                  icons[i].getAttribute("rel") === "apple-touch-icon"
                    ? "/vagtplan-apple-touch-icon.png?v=3"
                    : href.replace("/favicon", "/vagtplan-favicon").replace("/icon-192", "/vagtplan-icon-192"));
              }
            } catch (eIcons) { /* keep the BonBox icons */ }
            if (isIOS) {
              // iOS staff route → NO manifest. Icon bookmarks /s/<token>.
              setManifest(null);
            } else {
              // Android/desktop staff route → per-staff manifest, first paint.
              setManifest("/portal/" + token + "/app.webmanifest");
            }
          } else if (isStandDevice) {
            if (isIOS) {
              // iOS → NO manifest, as for the staff portal and the owner's
              // stand: Add to Home Screen then bookmarks THIS address —
              // /stand/<token>, the device's own book — so the icon opens
              // tonight's book on every cold start.
              setManifest(null);
            } else {
              // Android/desktop → the paired device's own manifest: start_url
              // /stand, which reopens the pairing this device remembers
              // (services/standAuth) — no token in a static file.
              setManifest("/stand-device.webmanifest");
            }
          } else if (isStand) {
            if (isIOS) {
              // iOS host stand → NO manifest, same reasoning as the staff
              // route: with no manifest present in the INITIAL document, iOS
              // Add-to-Home bookmarks the current URL (/reservations/stand)
              // and takes its name from apple-mobile-web-app-title. A manifest
              // here would bind the icon to start_url "/" instead — the very
              // bug. (iPad is the device this screen is for, so this is the
              // branch that actually matters.)
              setManifest(null);
            } else {
              // Android/desktop → a real stand manifest: start_url
              // /reservations/stand and orientation "any" so a landscape
              // tablet is not forced into portrait.
              setManifest("/stand.webmanifest");
            }
          } else {
            // Owner / marketing / any non-portal route → generic manifest.
            setManifest("/manifest.json");
          }
        } catch (e) {
          // Anything unexpected → fall back to the generic manifest so the
          // owner app still installs. (A stray manifest on a staff route is
          // harmless on iOS only if it points at "/", which is exactly the
          // bug — but this catch only runs on a real JS error, not normally.)
          try {
            var l = document.querySelector('link[rel="manifest"]');
            if (!l) {
              l = document.createElement("link");
              l.setAttribute("rel", "manifest");
              document.head.appendChild(l);
            }
            l.setAttribute("href", "/manifest.json");
          } catch (e2) { /* give up — no manifest */ }
        }
      })();
    </script>

    <script>
      // Force light mode by default — only honor "dark" if the user explicitly
      // toggled it. This runs before React mounts, so no flash of dark theme
      // on first load. Migration: any legacy users with theme=null/undefined
      // will see light mode immediately.
      (function () {
        // LIGHT ground + browser bar (12 Oct 2026): paper ONLY on a route known
        // to draw on the paper (the owner app, the paper auth screens, the
        // schedule wall screen, the landing "/" and "/v2" since 22 Oct 2026);
        // white html/body (.bb-page-white) and the
        // static white bar everywhere else — so a guest page, incl. the vanity
        // /<slug> that no list can name, never flashes cream on a cold load.
        // Keep equal to PAPER_PATHS / PAPER_PREFIXES in src/utils/themeColor.js
        // — creamCanvas.test.js runs both on the same paths. Outside the
        // localStorage try: it must run even when storage is blocked.
        var wp = location.pathname.replace(/\/+$/, "") || "/";
        var paper = /^\/workshop\/job\//.test(wp) || [
          "/", "/v2",
          "/login", "/register", "/forgot-password", "/verify-email", "/contact", "/staff/schedule/stand", "/staff",
          "/dashboard", "/sales", "/events", "/reservations", "/gavekort", "/scan", "/expenses", "/inventory",
          "/staffing", "/weather", "/waste", "/weekly-report", "/vat-report", "/reports", "/feedback", "/cashbook",
          "/cashflow", "/tax", "/pricing", "/retention", "/expiry", "/competitors", "/branches", "/outlets",
          "/consolidated-close", "/terminals", "/modules", "/daily-close/multi", "/share-recipients", "/daily-close",
          "/workshop", "/wine-list", "/bar", "/workshop/new-job", "/recently-deleted", "/profile", "/personal",
          "/khata", "/faktura", "/faktura/review", "/customers", "/mileage", "/loans", "/imports", "/bank-import",
          "/payment-imports", "/budgets", "/team", "/staff/schedule", "/staff/hours", "/staff/time-registration",
          "/staff/tips", "/staff/payroll", "/more", "/subscription", "/bookkeeping-export", "/month-end", "/insights",
          "/daily-report", "/channel-settings", "/connections", "/accountant/clients",
          "/admin", "/admin/training", "/admin/support"
        ].indexOf(wp) !== -1;
        if (!paper) document.documentElement.classList.add("bb-page-white");
        // The embedded booking widget (/r/<slug>?embed=1, framed in the owner's
        // website or the owner's preview) is always light: the stored theme
        // is skipped, never rewritten. The page holds it off too once mounted
        // (forceLightTheme, src/utils/themeColor.js; embedLight.test.jsx).
        var embed = !paper && /[?&]embed=1(&|$)/.test(location.search);
        try {
          var t = localStorage.getItem("theme");
          if (t === "dark" && embed) {
            document.documentElement.classList.remove("dark");
          } else if (t === "dark") {
            document.documentElement.classList.add("dark");
            // The browser bar follows the theme (surface-card, see
            // src/utils/themeColor.js). Not on pages that never render dark:
            // the staff portal /s/ and LIGHT_ONLY_PATHS (landing, /join,
            // /stand, magic-link/claim). Keep this list equal to
            // themeColor.js — dashboardDarkMode.test.js runs both on the same
            // paths. Light is written below the try (paper routes only).
            var p = location.pathname.replace(/\/+$/, "") || "/";
            var lightOnly = location.pathname.indexOf("/s/") === 0 ||
              ["/", "/v2", "/join", "/stand", "/login/magic", "/login/claim"].indexOf(p) !== -1;
            if (!lightOnly) {
              var tc = document.querySelector('meta[name="theme-color"]');
              if (tc) tc.setAttribute("content", "#1f2937");
            }
          } else {
            document.documentElement.classList.remove("dark");
            // Normalize the localStorage value so future reads are consistent
            if (t !== "light") localStorage.setItem("theme", "light");
          }
        } catch (e) { /* localStorage blocked in private mode — default light */ }
        // Light on a paper route: the paper bar now, not on React's first
        // commit. Every other route keeps the static white.
        if (paper && !document.documentElement.classList.contains("dark")) {
          var lc = document.querySelector('meta[name="theme-color"]');
          if (lc) lc.setAttribute("content", "#f6f4ec");
        }
      })();
    </script>

    <script>
      // Register service worker for PWA + force update
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").then(function(reg) {
            // Check for updates every page load
            reg.update();
          }).catch(() => {});
        });
      }

      // Auto-recover from stale cache crashes
      // If the app crashes and shows ErrorBoundary, this detects it and clears cache
      window.addEventListener("error", function(e) {
        // Only trigger on chunk/module load failures
        if (e.message && (e.message.includes("Loading chunk") || e.message.includes("Failed to fetch") || e.message.includes("Importing a module"))) {
          // Phone home BEFORE the reload — this window-level handler can fire
          // before React mounts (a broken entry/route chunk), so the in-app
          // ErrorBoundary may never see it. Fire once, best-effort, minimal-PII.
          try {
            if (!sessionStorage.getItem("cc_reported")) {
              sessionStorage.setItem("cc_reported", "1");
              var h = (location && location.hostname) || "";
              var base = (h === "bonbox.dk" || h.endsWith(".bonbox.dk")) ? "https://api.bonbox.dk/api" : "";
              if (base && navigator && navigator.sendBeacon) {
                var body = JSON.stringify({
                  kind: "chunk_load",
                  route: (location.pathname || "").slice(0, 200),
                  message: String(e.message || "").slice(0, 500),
                  chunk: (String(e.filename || "").split("/").pop() || "").slice(0, 160),
                  build_id: "boot"
                });
                navigator.sendBeacon(base + "/diagnostics/client-error", new Blob([body], { type: "application/json" }));
              }
            }
          } catch (x) { /* best-effort */ }
          // Clear all caches and reload once
          if (!sessionStorage.getItem("cache_cleared")) {
            sessionStorage.setItem("cache_cleared", "1");
            if ("caches" in window) {
              caches.keys().then(function(keys) {
                return Promise.all(keys.map(function(k) { return caches.delete(k); }));
              }).then(function() {
                window.location.reload();
              });
            }
          }
        }
      });
    </script>
  </body>
</html>
