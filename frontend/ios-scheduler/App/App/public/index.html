    <!-- NOTE: the <link rel="manifest"> is NOT shipped statically here.
         It is written by the inline script below so that on a staff-portal
         route (/s/<slug>/<token>) the browser NEVER even sees the generic
         /manifest.json (start_url "/") — on iOS the very first manifest link
         present in the initial document is what Add-to-Home binds to, and a
         JS href swap after parse is too late (see the script comment). On
         every other route the script writes the generic /manifest.json, so
         the owner app is unchanged. -->
    <script>
      // ───────────────────────────────────────────────────────────────────
      // PWA manifest selection — runs in <head> BEFORE React, before the
      // browser settles on a manifest, before any Add-to-Home read.
      //
      // THE iOS BUG THIS FIXES
      // On /s/<slug>/<token> (a staff schedule), tapping Share → Add to Home
      // Screen produced an icon that opened "/" (the generic owner app),
      // not the staff schedule. Root cause: iOS Safari Add-to-Home does NOT
      // honor a <link rel="manifest"> whose href is mutated by JavaScript
      // after the initial HTML parse. It reads the manifest reference present
      // in the *initial document*. So shipping a static generic manifest
      // (start_url "/") and "fixing" its href in JS is invisible to iOS — it
      // bookmarks the generic start_url "/". (Worse for us: iOS standalone
      // apps have storage ISOLATED from Safari, so the "/" → /s/<token>
      // localStorage fallback in PublicOrDashboard can't fire from a
      // standalone launch — localStorage is empty there.)
      //
      // THE FIX (per-platform):
      //   • iOS  → ship NO manifest at all on /s/ routes. With no manifest,
      //            iOS Add-to-Home falls back to bookmarking the CURRENT page
      //            URL (= /s/<slug>/<token>) and uses apple-touch-icon +
      //            apple-mobile-web-app-title for the icon. This is the
      //            long-stable, documented iOS behavior and makes the icon
      //            open the schedule. (StaffPortalPage further sets the
      //            apple title to the venue name; it must NOT re-add a
      //            manifest on iOS — it guards on this same flag.)
      //   • non-iOS (Android/desktop Chrome) → write the per-staff manifest
      //            as the FIRST/only manifest link so installability is
      //            evaluated against the dedicated schedule app and the
      //            install prompt arms with start_url /s/<token>.
      //   • any other route → write the generic /manifest.json (owner app
      //            install unchanged).
      //
      // We expose window.__BONBOX_IS_IOS / __BONBOX_PORTAL_TOKEN so the React
      // layer stays consistent and never re-introduces a manifest on iOS.
      // ───────────────────────────────────────────────────────────────────
      (function () {
        try {
          // iPadOS 13+ reports as "Macintosh" but is touch-capable; treat it
          // as iOS for A2HS purposes. Covers iPhone/iPad/iPod + iPad-as-Mac.
          var ua = navigator.userAgent || "";
          var isIOS =
            /iphone|ipad|ipod/i.test(ua) ||
            (navigator.maxTouchPoints > 1 && /Macintosh/i.test(ua));
          window.__BONBOX_IS_IOS = isIOS;

          var m = location.pathname.match(/^\/s\/(?:[^\/]+\/)?([^\/?#]+)/);
          var token = m && m[1] ? m[1] : null;
          window.__BONBOX_PORTAL_TOKEN = token;

          function setManifest(href) {
            var link = document.querySelector('link[rel="manifest"]');
            if (!href) {
              // No manifest wanted (iOS staff route) — make sure none exists,
              // so iOS Add-to-Home uses the current page URL.
              if (link && link.parentNode) link.parentNode.removeChild(link);
              return;
            }
            if (!link) {
              link = document.createElement("link");
              link.setAttribute("rel", "manifest");
              document.head.appendChild(link);
            }
            link.setAttribute("href", href);
          }

          if (token) {
            if (isIOS) {
              // iOS staff route → NO manifest. Icon bookmarks /s/<token>.
              setManifest(null);
            } else {
              // Android/desktop staff route → per-staff manifest, first paint.
              setManifest("/portal/" + token + "/app.webmanifest");
            }
          } else {
            // Owner / marketing / any non-portal route → generic manifest.
            setManifest("/manifest.json");
          }
        } catch (e) {
          // Anything unexpected → fall back to the generic manifest so the
          // owner app still installs. (A stray manifest on a staff route is
          // harmless on iOS only if it points at "/", which is exactly the
          // bug — but this catch only runs on a real JS error, not normally.)
          try {
            var l = document.querySelector('link[rel="manifest"]');
            if (!l) {
              l = document.createElement("link");
              l.setAttribute("rel", "manifest");
              document.head.appendChild(l);
            }
            l.setAttribute("href", "/manifest.json");
          } catch (e2) { /* give up — no manifest */ }
        }
      })();
    </script>

    <script>
      // Force light mode by default — only honor "dark" if the user explicitly
      // toggled it. This runs before React mounts, so no flash of dark theme
      // on first load. Migration: any legacy users with theme=null/undefined
      // will see light mode immediately.
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t === "dark") {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
            // Normalize the localStorage value so future reads are consistent
            if (t !== "light") localStorage.setItem("theme", "light");
          }
        } catch (e) { /* localStorage blocked in private mode — default light */ }
      })();
    </script>
    <div id="root"></div>
    <script>
      // Register service worker for PWA + force update
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").then(function(reg) {
            // Check for updates every page load
            reg.update();
          }).catch(() => {});
        });
      }

      // Auto-recover from stale cache crashes
      // If the app crashes and shows ErrorBoundary, this detects it and clears cache
      window.addEventListener("error", function(e) {
        // Only trigger on chunk/module load failures
        if (e.message && (e.message.includes("Loading chunk") || e.message.includes("Failed to fetch") || e.message.includes("Importing a module"))) {
          // Phone home BEFORE the reload — this window-level handler can fire
          // before React mounts (a broken entry/route chunk), so the in-app
          // ErrorBoundary may never see it. Fire once, best-effort, minimal-PII.
          try {
            if (!sessionStorage.getItem("cc_reported")) {
              sessionStorage.setItem("cc_reported", "1");
              var h = (location && location.hostname) || "";
              var base = (h === "bonbox.dk" || h.endsWith(".bonbox.dk")) ? "https://api.bonbox.dk/api" : "";
              if (base && navigator && navigator.sendBeacon) {
                var body = JSON.stringify({
                  kind: "chunk_load",
                  route: (location.pathname || "").slice(0, 200),
                  message: String(e.message || "").slice(0, 500),
                  chunk: (String(e.filename || "").split("/").pop() || "").slice(0, 160),
                  build_id: "boot"
                });
                navigator.sendBeacon(base + "/diagnostics/client-error", new Blob([body], { type: "application/json" }));
              }
            }
          } catch (x) { /* best-effort */ }
          // Clear all caches and reload once
          if (!sessionStorage.getItem("cache_cleared")) {
            sessionStorage.setItem("cache_cleared", "1");
            if ("caches" in window) {
              caches.keys().then(function(keys) {
                return Promise.all(keys.map(function(k) { return caches.delete(k); }));
              }).then(function() {
                window.location.reload();
              });
            }
          }
        }
      });
    </script>
