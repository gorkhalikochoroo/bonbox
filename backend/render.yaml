# Render Blueprint for the API. Every key below is listed by NAME only.
# Secrets are always sync:false: never value:/generateValue (a Blueprint
# rebuild would mint a new SECRET_KEY and orphan sessions and encrypted rows).
# sync:false never overwrites a value already set in the Render dashboard; it
# only makes the key visible here, so a rebuilt service is not silently
# missing one (INFRA-07, R-i). Only ENVIRONMENT and USE_CLAUDE_API carry a
# value: they are not secrets and must survive a rebuild.
services:
  - type: web
    name: bonbox-api
    runtime: python
    # Pinned so a Blueprint rebuild matches production: without region: Render
    # creates the service in oregon (US), which breaks the EU data-residency
    # premise (guest and allergy data, Supabase eu-west-1) and adds US latency
    # to every DB call; without plan: it gets the default size. frankfurt and
    # standard (1 CPU / 2 GB) are the live service (verified 10 Oct 2026).
    region: frankfurt
    plan: standard
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    # Points at /api/health/ready (NOT the static /api/health) so a schema-drift
    # or failed DB init fails the probe → Render aborts the cutover and keeps the
    # previous healthy deploy live, instead of promoting a 503-forever worker.
    healthCheckPath: /api/health/ready
    envVars:
      - key: DATABASE_URL
        sync: false
      # JWT signing key. sync:false, NOT generateValue: a regenerated value
      # signs everyone out. Rotate only together with SECRET_KEY_PREVIOUS.
      - key: SECRET_KEY
        sync: false
      # Cloudflare origin lock (main.py cloudflare_origin_guard): when set, the
      # app 403s every request without header `X-Bonbox-Origin`. LEAVE UNSET:
      # BonBox has no Cloudflare zone of its own (DNS is at Simply.com; the
      # Cloudflare in front of api.bonbox.dk is Render's edge), so nothing can
      # add the header and setting this would 403 the whole API. Unset = OFF.
      - key: ORIGIN_SHARED_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Owner contact — receives new-signup notifications + ops alerts.
      # In Render: set this to iside653@gmail.com (or whichever Manoj checks).
      - key: ADMIN_EMAIL
        sync: false
      # Comma-separated allowlist of emails that may reach /api/admin/*.
      # Defense-in-depth: the user must ALSO have role='super_admin' in DB.
      - key: SUPER_ADMIN_EMAILS
        sync: false
      # AI / vision (Claude wine scanner, agent, sommelier)
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: USE_CLAUDE_API
        value: "true"
      # Optional integrations — can be left blank in early deploy
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: COMPANIES_HOUSE_API_KEY
        sync: false
      # Production marker so security headers + log filtering activate
      - key: ENVIRONMENT
        value: production
      # ── Stripe subscription billing ──
      # Get these from Stripe dashboard → Developers → API keys + Products + Webhooks.
      # Live keys (sk_live_…) live ONLY in Render env vars — never in git.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID_PRO
        sync: false
      # ── Secrets (signing / encryption). Rotate APP_SECRET_KEY only together with
      # APP_SECRET_KEY_PREVIOUS, SECRET_KEY only with SECRET_KEY_PREVIOUS —
      # otherwise encrypted rows / sessions become unreadable. ──
      - key: APP_SECRET_KEY
        sync: false
      - key: APP_SECRET_KEY_PREVIOUS
        sync: false
      - key: SECRET_KEY_PREVIOUS
        sync: false
      - key: GAVEKORT_SIGNING_KEY
        sync: false
      - key: TICKET_SIGNING_KEY
        sync: false
      - key: BOOKING_TOKEN_KEY
        sync: false
      - key: BONBOX_CRON_SECRET
        sync: false
      # ── Durable file storage (Supabase). Without URL + service key, production
      # refuses uploads (fail-closed) and /api/health/storage answers 503. ──
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_RECEIPTS_BUCKET
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # ── Nightly off-project backup (services/backup_service.py). The keys of
      # the SEPARATE bonbox-backup project (Frankfurt), never the main one.
      # Without all three the backup is off and /api/admin/backup-health says
      # so; without BACKUP_ENCRYPTION_KEY no backup can ever be read. ──
      - key: BACKUP_SUPABASE_URL
        sync: false
      - key: BACKUP_SUPABASE_SERVICE_KEY
        sync: false
      - key: BACKUP_ENCRYPTION_KEY
        sync: false
      - key: BACKUP_ENCRYPTION_KEY_PREVIOUS
        sync: false
      # ── Mail and ops alerts (recipients = ADMIN_EMAIL + SUPER_ADMIN_EMAILS) ──
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: SUPPORT_NOTIFY_EMAIL
        sync: false
      - key: SUPPORT_REPLY_TO
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: OPS_ALERTS_ENABLED
        sync: false
      - key: OPS_ALERT_DAILY_CAP
        sync: false
      - key: OPS_ALERT_COOLDOWN_MINUTES
        sync: false
      # ── Stripe (continued) ──
      - key: STRIPE_WEBHOOK_SECRET_TEST
        sync: false
      - key: STRIPE_PRICE_ID_STARTER
        sync: false
      - key: STRIPE_PRICE_ID_STARTER_FOUNDING
        sync: false
      - key: STRIPE_PRICE_ID_PRO_FOUNDING
        sync: false
      - key: STRIPE_TOS_CONSENT
        sync: false
      - key: STRIPE_AUTOMATIC_TAX
        sync: false
      # ── Push (web push VAPID + native APNs) ──
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: APNS_AUTH_KEY
        sync: false
      - key: APNS_KEY_ID
        sync: false
      - key: APNS_TEAM_ID
        sync: false
      - key: APNS_TOPIC
        sync: false
      - key: APNS_USE_SANDBOX
        sync: false
      # ── Sign in with Apple ──
      - key: APPLE_CLIENT_ID
        sync: false
      - key: APPLE_TEAM_ID
        sync: false
      # ── Public URLs used in links the server sends ──
      - key: PUBLIC_API_URL
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      # ── SMS ──
      - key: SMS_PROVIDER
        sync: false
      - key: GATEWAYAPI_TOKEN
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        sync: false
      # ── Receipt OCR ──
      - key: MINDEE_API_KEY
        sync: false
      - key: GOOGLE_VISION_API_KEY
        sync: false
      - key: OCRSPACE_API_KEY
        sync: false
      # ── Inbound mail inbox (Postmark) ──
      - key: POSTMARK_INBOUND_USER
        sync: false
      - key: POSTMARK_INBOUND_PASS
        sync: false
      - key: INBOX_ENABLED
        sync: false
      # ── Feature flags ──
      - key: PORTAL_PIN_ENFORCE
        sync: false
      - key: DEBUG_BILLING_ENABLED
        sync: false
      - key: ENABLE_BANK_CONNECT
        sync: false
      - key: BANK_PROVIDER
        sync: false
      # R-h privacy clean-ups: OFF in code (dry-run counts only). Manoj turns
      # them on in Render after checking GET /api/admin/privacy-purges; listed
      # so a rebuilt service does not silently drop a flag he switched on.
      - key: PRIVACY_PURGE_WAITLIST_ENABLED
        sync: false
      - key: PRIVACY_PURGE_ORPHANS_ENABLED
        sync: false
      - key: AUDIT_EMAIL_CLEANUP_ENABLED
        sync: false
      # ── Bank connect, MobilePay, WhatsApp ──
      - key: GOCARDLESS_SECRET_ID
        sync: false
      - key: GOCARDLESS_SECRET_KEY
        sync: false
      - key: GOCARDLESS_BAD_SECRET_ID
        sync: false
      - key: GOCARDLESS_BAD_SECRET_KEY
        sync: false
      - key: GOCARDLESS_BAD_REDIRECT_URI
        sync: false
      - key: AIIA_CLIENT_ID
        sync: false
      - key: AIIA_CLIENT_SECRET
        sync: false
      - key: AIIA_ENV
        sync: false
      - key: AIIA_REDIRECT_URI
        sync: false
      - key: SALTEDGE_APP_ID
        sync: false
      - key: SALTEDGE_SECRET
        sync: false
      - key: YAPILY_APPLICATION_ID
        sync: false
      - key: YAPILY_APPLICATION_SECRET
        sync: false
      - key: MOBILEPAY_CLIENT_ID
        sync: false
      - key: MOBILEPAY_CLIENT_SECRET
        sync: false
      - key: MOBILEPAY_ENV
        sync: false
      - key: WHATSAPP_ENABLED
        sync: false
      - key: WHATSAPP_WEBHOOK_URL
        sync: false
