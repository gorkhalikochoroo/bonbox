# gitleaks config. Keeps the full built-in ruleset and adds ONE narrow allowlist.
[extend]
useDefault = true

# Only generic-api-key, and only inside the committed Scheduler web bundle.
# That folder is Vite build output that Capacitor packs into the iOS app, so
# it has to stay committed. Its minified translation objects, such as
# {key:`landingV2.schedule.dayMon`,en:`MON`}, trip the entropy check on every
# release: all 209 such hits in the 5 Oct scan were translation keys.
#
# A finding is skipped only when ALL of these hold (condition = "AND"):
#   - the file is a .js file directly in that bundle folder, and
#   - the whole match (regexTarget = "match") is a property named exactly
#     `key`, backtick-quoted, whose value is a translation-key identifier:
#     a lowercase word, then Capitalised words (each word at least two
#     lowercase letters, optionally ending in a number of at most 3 digits),
#     optionally dotted (landingV2.schedule.dayMon, hovFrameMonth15).
# So apiKey:`...`, secretKey:"...", or a random token in the bundle is still
# reported (under 0.05% of random 16-character tokens fit the shape, none of
# 200,000 at 32), and every provider rule (stripe, aws, gcp, github and the
# rest) scans these files as before. The bundle is also the one place a VITE_*
# value baked in at build time would land, which is why the path alone is
# not enough.
[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Scheduler bundle: minified {key:`translationKey`} objects"
condition = "AND"
regexTarget = "match"
paths = ['''^frontend/ios-scheduler/App/App/public/assets/[^/]+\.js$''']
regexes = ['''^key:\x60[a-z]{2,}(?:[A-Z]?[0-9]{1,3})?(?:[A-Z][a-z]{2,}(?:[A-Z]?[0-9]{1,3})?)*(?:\.[a-z]{2,}(?:[A-Z]?[0-9]{1,3})?(?:[A-Z][a-z]{2,}(?:[A-Z]?[0-9]{1,3})?)*)*\x60$''']
