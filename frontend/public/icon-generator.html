<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BonBox App Icon Generator</title>
<style>
  body { background: #1a1a1a; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; font-family: -apple-system, sans-serif; color: white; gap: 20px; }
  canvas { border-radius: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
  .info { text-align: center; color: #888; font-size: 14px; }
  button { background: #093A26; color: #F6F4EC; border: none; padding: 12px 32px; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; }
  button:hover { background: #0c4d33; }
  .row { display: flex; gap: 20px; align-items: end; }
</style>
</head>
<body>

<h2>BonBox App Icon</h2>

<div class="row">
  <div style="text-align:center">
    <p class="info">1024x1024 (App Store)</p>
    <canvas id="icon" width="1024" height="1024"></canvas>
  </div>
  <div style="text-align:center">
    <p class="info">Preview (180x180)</p>
    <canvas id="preview" width="180" height="180" style="border-radius:40px"></canvas>
  </div>
</div>

<button onclick="download()">Download 1024x1024 PNG</button>
<p class="info">Right-click the large icon to "Save Image As" or click the button</p>

<script>
// The kit's app icon (docs/brand/app-icon/bonbox-app-icon-1024.svg): a forest
// square and the paper b, one path on the 1024 grid. Square on purpose — iOS
// and Android apply their own mask. If the kit changes, copy the path again.
const KIT_FOREST = "#093A26";
const KIT_PAPER = "#F6F4EC";
const KIT_B = "M274 183V540A255 255 0 0 0 529 795A255 255 0 0 0 784 540A187 187 0 0 0 597 353A187 187 0 0 0 410 540A119 119 0 0 0 529 659V574A34 34 0 0 1 495 540A102 102 0 0 1 597 438A102 102 0 0 1 699 540A170 170 0 0 1 529 710A170 170 0 0 1 359 540V183Z";

function drawIcon(ctx, size) {
  const s = size / 1024; // scale factor
  ctx.save();
  ctx.fillStyle = KIT_FOREST;
  ctx.fillRect(0, 0, size, size);
  ctx.scale(s, s);
  ctx.fillStyle = KIT_PAPER;
  ctx.fill(new Path2D(KIT_B));
  ctx.restore();
}

// Draw both sizes
const canvas = document.getElementById('icon');
drawIcon(canvas.getContext('2d'), 1024);

const preview = document.getElementById('preview');
drawIcon(preview.getContext('2d'), 180);

function download() {
  const link = document.createElement('a');
  link.download = 'AppIcon-1024x1024.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}
</script>
</body>
</html>
