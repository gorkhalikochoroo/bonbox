# Run the test suites. On every push and every PR.
#
# WHY THIS DID NOT EXIST. There are 5,514 tests here and, until now, nothing
# automated ran them — the only workflow was a weekly dependency audit. The
# pre-commit hook runs the i18n, no-undef and money-write guards plus a build,
# but not pytest and not vitest. The only thing standing between a red suite
# and production was someone remembering to run it, and pushes go straight to
# production with no staging.
#
# It also could not have worked before today: pytest and pypdf were installed
# on the founder's machine but declared nowhere, so a fresh checkout could not
# run the backend suite at all. requirements-dev.txt fixes that; verified by
# installing into an empty venv and running the full suite green (4,061 passed,
# 1 skipped) before this file was added.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

# A superseded push does not need its run finished.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      # MOST tests build their own in-memory SQLite and override get_db, but
      # not all of them are hermetic: `accountant_write_guard` is HTTP
      # middleware, so it runs OUTSIDE dependency_overrides and does its role
      # lookup on the app's own engine. With no database it cannot answer, and
      # it correctly fails CLOSED with 503 — which surfaced as 42 red tests
      # (`assert 503 == 200`, `role_check_unavailable`) that look like broken
      # auth and are really a missing database.
      #
      # Locally this is invisible: backend/.env sets DATABASE_URL to a SQLite
      # file that has accumulated a schema, so the guard always finds its
      # tables. .env is gitignored, so CI fell through to the config default
      # (postgresql://…@localhost:5432) and got connection-refused.
      #
      # So: point the app at a file SQLite and CREATE THE SCHEMA first. An
      # empty file is not enough — a fresh DB has zero tables, and the guard
      # fails exactly as it does with no DB at all.
      #
      # This tests the SQLite path, not the Postgres one production runs. That
      # gap is real and documented (PG and the SQLite migration mirror can
      # drift); a second PG-backed job is the right follow-up, and it is NOT
      # written here because it could not be verified on this machine — no
      # local Postgres, no Docker. An unverified CI job is worse than none.
      - name: Create the schema the middleware needs
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: |
          python -c "
          from app.database import Base, engine
          import app.models  # registers every model on Base.metadata
          Base.metadata.create_all(engine)
          "
      - name: pytest
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: python -m pytest -q

  frontend:
    name: frontend (vitest + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, not 20, because the dev machine runs 22 and the suite uses
          # node:fs globSync (added in 22) — on 20 that is `undefined` and
          # deadInterpolatedFallback.test.js dies with "globSync is not a
          # function" AFTER 1452 tests pass, which reads like a real failure.
          # A CI runtime older than the one the code is written on tests a
          # thing nobody runs. GitHub has also deprecated Node 20 on runners.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: vitest
        working-directory: frontend
        run: npx vitest run
      - name: Build
        working-directory: frontend
        # The pre-commit hook builds too, but a hook can be skipped with
        # --no-verify and does not run on anyone else's machine.
        run: npm run build

  guards:
    name: repo guards (i18n + money writes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: i18n guards
        working-directory: frontend
        # Same checks the pre-commit hook runs, now enforced server-side where
        # --no-verify cannot reach them.
        run: npm run lint:i18n
